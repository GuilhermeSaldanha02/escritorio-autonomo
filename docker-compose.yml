# Serviços locais da V1 — imagens gratuitas/oficiais, sem nenhum serviço externo.
# Credenciais vêm do .env (copie de .env.example). Portas presas em 127.0.0.1.
#
# Os tetos de memória são requisito, não enfeite: o projeto precisa rodar numa
# máquina de 8 GB de RAM junto com o resto do ambiente de desenvolvimento.

name: escritorio-autonomo

services:
  postgres:
    # Imagem oficial do projeto pgvector (PostgreSQL 17 + extensão vector).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=40
      -c work_mem=4MB
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ exige noeviction: um job nunca pode ser descartado por pressão de memória.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 64mb
      --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
